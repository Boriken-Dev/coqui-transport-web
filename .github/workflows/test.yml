name: Test

# On demand: workflow_dispatch (optionally at a ref), or a pushed "ci-*" tag, deleted after its run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The committed public API, so a change to it is seen in review. Regenerate with:
  # cargo +nightly-2026-09-21 public-api --all-features -sss --color never > tools/public-api.txt
  public-api:
    name: Public API snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # cargo-public-api 0.52 reads the rustdoc JSON of this nightly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
      - name: Install cargo-public-api
        run: cargo +stable install cargo-public-api --version 0.52.0 --locked
      - name: Compare with tools/public-api.txt
        run: |
          cargo +nightly-2026-09-21 public-api --all-features -sss --color never > "$RUNNER_TEMP/public-api.txt"
          diff -u tools/public-api.txt "$RUNNER_TEMP/public-api.txt"

  rust:
    name: Rust (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, "1.89"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --features websocket -- -D warnings
      - run: cargo clippy --all-targets --features webtransport -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The default build on a target with no operating system: the codecs, the endpoints and the fallback policy build there.
  wasm:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/dart/coqui_transport_web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

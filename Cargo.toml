[package]
name = "coqui-web-channel"
version = "0.0.0-alpha.0"
description = "Reliable message channels a browser can open natively, and their native peers: WebTransport, WebSocket and a safe fallback between them"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-web-channel"
homepage = "https://boriken-dev.github.io/coqui-web-channel/"
keywords = ["webtransport", "websocket", "fallback", "framing", "browser"]
categories = ["network-programming", "web-programming::websocket"]
exclude = [".*", "*.local.*", "/bindings/", "/tools/"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# `websocket::{Dialer, Listener}`: blocking WebSocket drivers, with TLS from the caller's rustls config.
websocket = ["dep:tungstenite", "dep:rustls", "dep:mio", "dep:socket2"]
# `webtransport::{Dialer, Listener}`: WebTransport drivers over a small runtime inside the driver.
webtransport = ["dep:wtransport", "dep:tokio", "dep:rustls"]
# `webrtc::Port`: one UDP port for WebTransport and WebRTC data channels, and a WebSocket channel that climbs onto one.
webrtc = ["websocket", "webtransport", "dep:str0m"]

[dependencies]
# Endpoints are validated URLs; validation backs a trust decision, so it is not hand-written.
url = "2.5"

# Same choice and floor as guatiao-source-remote: no default features, TLS comes from the caller.
tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
# A worker waits on its socket and on callers at once, with no wake-up of its own on an idle channel. Safe to register, which
# `polling` is not, and already beneath quinn.
mio = { version = "1", optional = true, default-features = false, features = ["os-poll", "net"] }
# A dialer bound to a chosen local address: std cannot bind a TCP socket before connecting it. Already beneath tokio.
socket2 = { version = "0.6", optional = true }
# Pre-1.0: the only maintained HTTP/3 WebTransport session crate on quinn that browsers interoperate with.
wtransport = { version = "0.7.2", optional = true, default-features = false, features = ["quinn", "ring"] }
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "time", "sync", "macros"] }
# Sans-IO, so it runs on the worker that owns the socket. `rust-crypto` is the one provider that builds alike on every platform here.
str0m = { version = "0.24", optional = true, default-features = false, features = ["rust-crypto"] }

[dev-dependencies]
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
url = "2.5"
time = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
wtransport = { version = "0.7.2", default-features = false, features = ["quinn", "ring"] }
# The tests that forge STUN, and count QUIC address tokens as a consumer with quinn's default `bloom` would see them.
hmac = "0.12"
sha1 = "0.10"
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["bloom"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

[[example]]
name = "echo"
required-features = ["websocket", "webtransport"]

[[example]]
name = "ladder"
required-features = ["webrtc"]

[[test]]
name = "ladder"
required-features = ["webrtc"]

[[test]]
name = "ladder_idle"
required-features = ["webrtc"]

[[test]]
name = "ladder_peers"
required-features = ["webrtc"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
